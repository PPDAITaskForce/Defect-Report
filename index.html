<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PPD-016 Defect Inspector</title>
  <!-- Load ExcelJS for native XLSX creation with embedded images -->
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.3.0/dist/exceljs.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f2f2f7;
      margin: 0;
      padding: 16px;
      color: #1c1c1e;
    }
    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    h2 { margin-top: 0; color: #007aff; font-size: 1.3rem; }
    h3 { margin-top: 0; color: #3a3a3c; font-size: 1.05rem; border-bottom: 1px solid #e5e5ea; padding-bottom: 8px; }
    label { font-weight: 600; display: block; margin-top: 12px; font-size: 0.85rem; color: #636366; }
    input[type="text"], textarea {
      width: 100%;
      padding: 10px 12px;
      margin-top: 4px;
      border-radius: 8px;
      border: 1px solid #c7c7cc;
      font-size: 15px;
      background: #fafafa;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px;
      background-color: #007aff;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      margin-top: 12px;
    }
    .btn:active { background-color: #0056b3; }
    .btn-secondary { background-color: #5856d6; }
    .btn-export { background-color: #34c759; margin-top: 20px; font-size: 17px; }
    .file-input-wrapper {
      position: relative;
      margin-top: 8px;
    }
    .file-input-btn {
      background-color: #e5e5ea;
      color: #007aff;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-weight: 600;
      display: block;
      cursor: pointer;
    }
    input[type="file"] {
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }
    #previewImg {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 8px;
      margin-top: 12px;
      display: none;
      border: 1px solid #d1d1d6;
    }
    .defect-card {
      display: flex;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #e5e5ea;
      align-items: center;
    }
    .defect-card:last-child { border-bottom: none; }
    .defect-card img {
      width: 65px;
      height: 65px;
      object-fit: cover;
      border-radius: 6px;
    }
    .defect-info { flex: 1; }
    .defect-title { font-weight: 600; font-size: 0.95rem; }
    .defect-desc { font-size: 0.85rem; color: #3c3c43; margin-top: 2px; }
    .delete-btn { color: #ff3b30; font-size: 0.8rem; cursor: pointer; border: none; background: none; padding: 0; margin-top: 4px; }
  </style>
</head>
<body>

  <h2>PPD-016 Defect Inspector</h2>

  <!-- Header Info -->
  <div class="card">
    <h3>1. Site Information</h3>
    <label>Project Name</label>
    <input type="text" id="projectName" value="LOHAS P12" />

    <label>Form Reference No.</label>
    <input type="text" id="formRef" value="P12 - 001" />

    <label>Location (Tower/Floor/Unit)</label>
    <input type="text" id="location" value="Tower 1A 56D" />

    <label>Checked by (PPD Inspector)</label>
    <input type="text" id="inspector" value="Brian Lau" />
  </div>

  <!-- Add Defect -->
  <div class="card">
    <h3>2. Record Defect</h3>
    
    <label>Photo</label>
    <div class="file-input-wrapper">
      <div class="file-input-btn" id="photoBtnText">📷 Take Photo / Choose File</div>
      <input type="file" id="photoInput" accept="image/*" capture="environment" onchange="handlePhotoSelect(event)" />
    </div>
    <img id="previewImg" alt="Preview" />

    <label>Defect Description</label>
    <textarea id="defectDesc" rows="3" placeholder="Enter defect description..."></textarea>

    <button type="button" class="btn btn-secondary" onclick="addDefect()">Add Defect Record</button>
  </div>

  <!-- List & Export -->
  <div class="card">
    <h3>3. Logged Defects (<span id="defectCount">0</span>/3)</h3>
    <div id="defectList"></div>

    <button type="button" class="btn btn-export" onclick="exportExcel()">Export PPD-016 Excel Report</button>
  </div>

  <script>
    let defects = [];
    let currentImageBase64 = null;

    function handlePhotoSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        currentImageBase64 = e.target.result;
        const img = document.getElementById('previewImg');
        img.src = currentImageBase64;
        img.style.display = 'block';
        document.getElementById('photoBtnText').innerText = '✓ Photo Attached (Tap to change)';
      };
      reader.readAsDataURL(file);
    }

    function addDefect() {
      const desc = document.getElementById('defectDesc').value.trim();

      if (!currentImageBase64) {
        alert('Please attach a photo first.');
        return;
      }
      if (!desc) {
        alert('Please enter a description.');
        return;
      }
      if (defects.length >= 3) {
        alert('PPD-016 standard sheet accommodates up to 3 defect records per sheet.');
      }

      defects.push({ image: currentImageBase64, desc: desc });

      // Reset form
      document.getElementById('defectDesc').value = '';
      document.getElementById('photoInput').value = '';
      document.getElementById('previewImg').style.display = 'none';
      document.getElementById('photoBtnText').innerText = '📷 Take Photo / Choose File';
      currentImageBase64 = null;

      renderDefects();
    }

    function removeDefect(index) {
      defects.splice(index, 1);
      renderDefects();
    }

    function renderDefects() {
      const listContainer = document.getElementById('defectList');
      document.getElementById('defectCount').innerText = defects.length;
      listContainer.innerHTML = '';

      defects.forEach((item, index) => {
        listContainer.innerHTML += `
          <div class="defect-card">
            <img src="${item.image}" />
            <div class="defect-info">
              <div class="defect-title">Defect Item #${index + 1}</div>
              <div class="defect-desc">${item.desc}</div>
              <button class="delete-btn" onclick="removeDefect(${index})">Delete</button>
            </div>
          </div>
        `;
      });
    }

    async function exportExcel() {
      if (defects.length === 0) {
        alert('Please record at least one defect before exporting.');
        return;
      }

      try {
        const workbook = new ExcelJS.Workbook();
        let worksheet;

        // Try to load external assets template if present, fallback to generator
        try {
          const res = await fetch('./assets/PPD-016.xlsx');
          if (res.ok) {
            const buffer = await res.arrayBuffer();
            await workbook.xlsx.load(buffer);
            worksheet = workbook.getWorksheet(1);
          }
        } catch (e) {
          console.log('Template asset fetch skipped, building directly.');
        }

        if (!worksheet) {
          worksheet = workbook.addWorksheet('Blank Form');
          
          // Apply basic sheet structure matching PPD-016
          worksheet.columns = [
            { width: 3 }, { width: 12 }, { width: 14 }, { width: 14 }, 
            { width: 14 }, { width: 14 }, { width: 14 }, { width: 14 }, 
            { width: 14 }, { width: 14 }, { width: 14 }, { width: 14 }, { width: 14 }
          ];

          worksheet.mergeCells('B1:M1');
          worksheet.getCell('B1').value = 'MTR PPD Site Representative Witness Record\nFlat Unit Handover Inspection Record for Individual Unit';
          worksheet.getCell('B1').alignment = { wrapText: true, horizontal: 'center', vertical: 'middle' };
          worksheet.getCell('B1').font = { bold: true, size: 12 };

          worksheet.getCell('B3').value = 'Project name:';
          worksheet.getCell('B5').value = 'Form Reference No. :';
          worksheet.getCell('B7').value = 'Location (Tower/Floor/Unit)';
          worksheet.getCell('B9').value = 'Date of Checking:';
          worksheet.getCell('H9').value = 'Date of Response:';
          worksheet.getCell('B11').value = 'Checked by (PPD):';
          worksheet.getCell('H11').value = 'Replied by (Developer):';

          worksheet.getCell('B13').value = 'Defects (Before)';
          worksheet.getCell('H13').value = 'Rectification (After)';
        }

        // Fill Metadata
        worksheet.getCell('F3').value = document.getElementById('projectName').value;
        worksheet.getCell('F5').value = document.getElementById('formRef').value;
        worksheet.getCell('F7').value = document.getElementById('location').value;
        worksheet.getCell('D9').value = new Date().toISOString().split('T')[0];
        worksheet.getCell('D11').value = document.getElementById('inspector').value;

        // Position maps matching PPD-016 form layout
        const descCells = ['B25', 'B38', 'B51'];
        const imageAnchors = [
          { tl: { col: 1, row: 13 }, br: { col: 7, row: 23 } }, // Rows 14-23, cols B-G
          { tl: { col: 1, row: 26 }, br: { col: 7, row: 36 } }, // Rows 27-36, cols B-G
          { tl: { col: 1, row: 39 }, br: { col: 7, row: 49 } }  // Rows 40-49, cols B-G
        ];

        for (let i = 0; i < defects.length; i++) {
          // Add Description
          worksheet.getCell(descCells[i]).value = defects[i].desc;

          // Embed Photo
          const imageId = workbook.addImage({
            base64: defects[i].image,
            extension: 'png',
          });

          worksheet.addImage(imageId, {
            tl: imageAnchors[i].tl,
            br: imageAnchors[i].br,
            editAs: 'oneCell'
          });
        }

        // Generate and trigger download
        const outBuffer = await workbook.xlsx.writeBuffer();
        const blob = new Blob([outBuffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        
        const filename = `PPD-016_${document.getElementById('location').value.replace(/[^a-zA-Z0-9]/g, '_')}_${Date.now()}.xlsx`;
        
        if (navigator.canShare && navigator.canShare({ files: [new File([blob], filename, { type: blob.type })] })) {
          const file = new File([blob], filename, { type: blob.type });
          await navigator.share({ files: [file], title: 'PPD-016 Defect Report' });
        } else {
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = filename;
          link.click();
          URL.revokeObjectURL(link.href);
        }

      } catch (err) {
        alert('Error generating Excel report: ' + err.message);
      }
    }
  </script>
</body>
</html>
